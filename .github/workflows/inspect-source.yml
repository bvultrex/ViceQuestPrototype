name: Inspect ViceQuest Source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-source.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild source
        shell: bash
        run: |
          set -euo pipefail
          cat ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1 \
              ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2 > /tmp/vq.zip
          echo "1554e2a9fd43624013cd8f3d934652176d7eb0d556c61d979105318baeb2caf3  /tmp/vq.zip" | sha256sum -c -
          mkdir -p /tmp/vq
          unzip -q /tmp/vq.zip -d /tmp/vq
          PROJECT_FILE="$(find /tmp/vq -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
      - name: Print gameplay source slices
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["PROJECT_DIR"])
          files=["scripts/main.gd","scripts/vehicle.gd","scripts/cop.gd","scripts/audio_manager.gd","scripts/player.gd"]
          needles=("vehicle","cop","agent","damage","enter","exit","engine","audio","pursuit","collision","physics","driver","hit","shot")
          for rel in files:
              p=root/rel
              print("\n===== FILE",rel,"=====")
              if not p.exists():
                  print("MISSING")
                  continue
              s=p.read_text(errors="replace")
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith("func ") and any(n in line.lower() for n in needles):
                      j=i+1
                      while j<len(lines) and not lines[j].startswith("func "):
                          j+=1
                      block="\n".join(lines[i:min(j,i+180)])
                      print(f"\n--- lines {i+1}-{min(j,i+180)} ---\n{block}")
              # key declarations / direct references
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(k in low for k in ("driver_id","current_speed","linear_velocity","velocity","engine_player","engine_key","response_role")):
                      a=max(0,i-3); b=min(len(lines),i+8)
                      print(f"\n... context {i+1} ...\n"+"\n".join(lines[a:b]))
          PY
