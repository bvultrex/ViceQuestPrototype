name: Inspect ViceQuest Source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-source.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild source
        shell: bash
        run: |
          set -euo pipefail
          cat ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1 \
              ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2 > /tmp/vq.zip
          echo "1554e2a9fd43624013cd8f3d934652176d7eb0d556c61d979105318baeb2caf3  /tmp/vq.zip" | sha256sum -c -
          mkdir -p /tmp/vq
          unzip -q /tmp/vq.zip -d /tmp/vq
          PROJECT_FILE="$(find /tmp/vq -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
      - name: Capture gameplay source slices
        shell: bash
        run: |
          python3 - <<'PY' > SOURCE_INSPECTION.txt
          import os
          from pathlib import Path
          root=Path(os.environ["PROJECT_DIR"])
          files=["scripts/main.gd","scripts/vehicle.gd","scripts/cop.gd","scripts/audio_manager.gd","scripts/player.gd"]
          needles=("vehicle","cop","agent","damage","enter","exit","engine","audio","pursuit","collision","physics","driver","hit","shot")
          for rel in files:
              p=root/rel
              print("\n===== FILE",rel,"=====")
              if not p.exists():
                  print("MISSING")
                  continue
              s=p.read_text(errors="replace")
              lines=s.splitlines()
              for i,line in enumerate(lines):
                  if line.startswith("func ") and any(n in line.lower() for n in needles):
                      j=i+1
                      while j<len(lines) and not lines[j].startswith("func "):
                          j+=1
                      block="\n".join(lines[i:min(j,i+220)])
                      print(f"\n--- lines {i+1}-{min(j,i+220)} ---\n{block}")
              for i,line in enumerate(lines):
                  low=line.lower()
                  if any(k in low for k in ("driver_id","current_speed","linear_velocity","velocity","engine_player","engine_key","response_role","is_alive","hp")):
                      a=max(0,i-4); b=min(len(lines),i+10)
                      print(f"\n... context {i+1} ...\n"+"\n".join(lines[a:b]))
          PY
      - name: Capture exact source detail
        shell: bash
        run: |
          {
            echo "===== MAIN HEAD ====="
            sed -n '1,460p' "$PROJECT_DIR/scripts/main.gd"
            echo "===== VEHICLE FULL ====="
            cat "$PROJECT_DIR/scripts/vehicle.gd"
            echo "===== AUDIO FULL ====="
            cat "$PROJECT_DIR/scripts/audio_manager.gd"
            echo "===== COP FULL ====="
            cat "$PROJECT_DIR/scripts/cop.gd"
          } > SOURCE_DETAIL.txt
      - name: Commit inspection output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vicequest-ci"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_INSPECTION.txt SOURCE_DETAIL.txt
          git commit -m "CI: capture detailed source inspection" || exit 0
          git push
