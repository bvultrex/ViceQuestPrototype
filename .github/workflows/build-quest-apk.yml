name: Build Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-quest-apk.yml"
      - "quest_patch/**"
      - "ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1"
      - "ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2"

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"
  OPENXR_VENDORS_VERSION: "4.3.1-stable"
  EXPORT_NAME: "ViceQuest-v0.6.17.0-Quest-VRPopout-SlopeFix"
  EXPECTED_SOURCE_SHA256: "1554e2a9fd43624013cd8f3d934652176d7eb0d556c61d979105318baeb2caf3"

jobs:
  quest-apk:
    name: Quest 3 / 3S debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Activate Godot CI templates and Android settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ -d "/root/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"

      - name: Rebuild Vice Quest source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PART1="ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1"
          PART2="ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2"
          test -s "$PART1"
          test -s "$PART2"
          cat "$PART1" "$PART2" > /tmp/vicequest-source.zip
          echo "$EXPECTED_SOURCE_SHA256  /tmp/vicequest-source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q /tmp/vicequest-source.zip -d "$GITHUB_WORKSPACE/source"
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Build filtered Quest pop-out meshes
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-pil
          python3 "$GITHUB_WORKSPACE/quest_patch/build_popout_assets.py" "$PROJECT_DIR"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_popout_0_0.meshbin"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_popout_3_3.meshbin"

      - name: Apply Quest VR board patch
        shell: bash
        run: |
          set -euo pipefail

          cp "$GITHUB_WORKSPACE/quest_patch/presentation_rig.gd" "$PROJECT_DIR/scripts/presentation_rig.gd"

          MAIN="$PROJECT_DIR/scripts/main.gd"
          INPUT="$PROJECT_DIR/scripts/input_bridge.gd"
          EXPORT="$PROJECT_DIR/export_presets.cfg"

          # Start OpenXR before loading/splash UI so Quest can actually see boot UI.
          sed -i '/func _ready() -> void:/,/    _build_boot_ui()/ {
            /    _configure_runtime_profile()/a\    _build_camera()
          }' "$MAIN"

          # Do not create the camera a second time at the end of boot.
          sed -i '/    _set_boot_progress(0.93, "Preparing camera and multiplayer menu")/ {
            n
            /    _build_camera()/d
          }' "$MAIN"

          # Route boot/menu/HUD CanvasLayers into the Quest game viewport.
          sed -i 's/^    add_child(boot_layer)$/    presentation_rig.ui_parent().add_child(boot_layer)/' "$MAIN"
          sed -i 's/^    add_child(canvas)$/    presentation_rig.ui_parent().add_child(canvas)/' "$MAIN"

          # Forward XR UI actions into the SubViewport that owns the controls.
          sed -i 's/input_bridge.configure(presentation_rig.left_controller, presentation_rig.right_controller, presentation_rig.xr_active)/input_bridge.configure(presentation_rig.left_controller, presentation_rig.right_controller, presentation_rig.xr_active, presentation_rig.ui_input_viewport())/' "$MAIN"

          sed -i '/var ui_navigation_enabled: bool = false/a\var ui_target_viewport: Viewport' "$INPUT"
          sed -i 's/func configure(left: XRController3D, right: XRController3D, enabled: bool) -> void:/func configure(left: XRController3D, right: XRController3D, enabled: bool, ui_target: Viewport = null) -> void:/' "$INPUT"
          sed -i '/    xr_active = enabled and left_controller != null and right_controller != null/a\    ui_target_viewport = ui_target' "$INPUT"
          sed -i '/    Input.parse_input_event(pressed)/a\    if ui_target_viewport != null and ui_target_viewport != get_viewport():\n        ui_target_viewport.push_input(pressed)' "$INPUT"
          sed -i '/    Input.parse_input_event(released)/a\    if ui_target_viewport != null and ui_target_viewport != get_viewport():\n        ui_target_viewport.push_input(released)' "$INPUT"

          # Make streamed GTA2 building meshes available as a true stereoscopic
          # pop-out layer on top of the flat gameplay viewport.
          sed -i '/    if force:/a\        if presentation_rig != null and presentation_rig.xr_active and gta2_atlas_material != null:\n            presentation_rig.sync_popout_chunks(gta2_visual_chunks, gta2_atlas_material.albedo_texture)' "$MAIN"

          sed -i '/^func _get_block_rect/i\    if presentation_rig != null and presentation_rig.xr_active and gta2_atlas_material != null:\n        presentation_rig.sync_popout_chunks(gta2_visual_chunks, gta2_atlas_material.albedo_texture)\n' "$MAIN"

          sed -i '/    if input_bridge != null:/i\    if presentation_rig != null:\n        presentation_rig.set_popout_enabled(game_started)\n' "$MAIN"

          # The host must execute its own respawn RPC too. Without call_local,
          # WASTED stayed visible until the next health/damage sync.
          sed -i '/@rpc("authority", "call_remote", "reliable")/{N;/func _respawn_player(id: int, spawn: Vector3)/s/call_remote/call_local/;}' "$MAIN"

          # Godot's all_resources filter does not automatically package our raw
          # Downtown mesh/collision/route banks. Without these Quest only sees
          # the fallback turquoise floor.
          sed -i 's@include_filter=""@include_filter="assets/gta2/downtown/*"@' "$EXPORT"

          grep -q 'presentation_rig.ui_parent().add_child(boot_layer)' "$MAIN"
          grep -q 'presentation_rig.ui_parent().add_child(canvas)' "$MAIN"
          grep -q 'ui_target_viewport.push_input(pressed)' "$INPUT"
          grep -q 'include_filter="assets/gta2/downtown/\*"' "$EXPORT"
          grep -q 'presentation_rig.sync_popout_chunks' "$MAIN"
          grep -q '@rpc("authority", "call_local", "reliable")' "$MAIN"
          echo "Quest VR pop-out + respawn patch applied."

      - name: Prepare Godot and Android
        shell: bash
        run: |
          set -euo pipefail
          java -version
          godot --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest"

      - name: Install OpenXR Vendors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openxr /tmp/openxr.zip
          mkdir -p /tmp/openxr
          wget -q "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip" -O /tmp/openxr.zip
          unzip -q -o /tmp/openxr.zip -d /tmp/openxr
          mkdir -p "$PROJECT_DIR/addons"
          rm -rf "$PROJECT_DIR/addons/godotopenxrvendors"
          cp -a /tmp/openxr/asset/addons/godotopenxrvendors "$PROJECT_DIR/addons/"
          test -f "$PROJECT_DIR/addons/godotopenxrvendors/plugin.gdextension"

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Build Quest APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/build/android-quest"
          godot --headless --verbose --path "$PROJECT_DIR"             --install-android-build-template             --export-debug "Android Quest"             "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"
          test -s "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"
          sha256sum "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"             > "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViceQuest-v0.6.17.0-Quest-VRPopout-SlopeFix
          path: |
            ${{ env.PROJECT_DIR }}/build/android-quest/*.apk
            ${{ env.PROJECT_DIR }}/build/android-quest/*.sha256
          if-no-files-found: error
          retention-days: 14
