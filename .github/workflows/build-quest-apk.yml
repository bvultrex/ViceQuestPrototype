name: Build Quest APK

on:
  workflow_dispatch:
  push:
    branches: [ main, continue-from-v0.6.18.5 ]
    paths:
      - ".github/workflows/build-quest-apk.yml"
      - "quest_patch/**"
      - "ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1"
      - "ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2"

permissions:
  contents: read

concurrency:
  group: vicequest-quest-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  OPENXR_VENDORS_VERSION: "4.3.1-stable"
  EXPORT_NAME: "ViceQuest-v0.6.18.25-CityVoice"
  EXPECTED_SOURCE_SHA256: "1554e2a9fd43624013cd8f3d934652176d7eb0d556c61d979105318baeb2caf3"

jobs:
  quest-apk:
    name: Quest 3 / 3S debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             python3 python3-pil unzip wget             libfontconfig1 libx11-6 libxcursor1 libxinerama1 libgl1

      - name: Install Godot 4.5.1 and export templates
        shell: bash
        run: |
          set -euo pipefail

          GODOT_TAG="${GODOT_VERSION}-stable"
          GODOT_BIN="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BIN}.zip"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          wget -q --show-progress "$GODOT_URL" -O /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/${GODOT_BIN}" /usr/local/bin/godot

          wget -q --show-progress "$TEMPLATE_URL" -O /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot-templates/templates/.             "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          godot --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "cmdline-tools;latest"
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Rebuild Vice Quest source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PART1="ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part1"
          PART2="ViceQuestPrototype-v0.6.17.0-GTA2-Behavior-Audio-Quest-FIXED.zip.part2"
          test -s "$PART1"
          test -s "$PART2"
          cat "$PART1" "$PART2" > /tmp/vicequest-source.zip
          echo "$EXPECTED_SOURCE_SHA256  /tmp/vicequest-source.zip" | sha256sum -c -
          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q /tmp/vicequest-source.zip -d "$GITHUB_WORKSPACE/source"
          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" -name project.godot -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Build filtered Quest city layers
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/build_popout_assets.py" "$PROJECT_DIR"
          grep -q '_popout_field_neighbor' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          grep -q 'roof_j=next(' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          grep -q '_pop_hidden_lid' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          grep -q '_pop_interior' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          ! grep -q 'j==top_j and z>=2 and int(bd' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_popout_0_0.meshbin"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_popout_3_3.meshbin"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_flat_0_0.meshbin"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_flat_3_3.meshbin"
          test -s "$PROJECT_DIR/assets/gta2/downtown/downtown_station_floor.bin"
          grep -q '_pop_stair' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          grep -q '_STAIR_DECK' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"

      - name: Extract GTA2 enforcement and HUD assets
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/extract_enforcement_assets.py" "$PROJECT_DIR"
          test -s "$PROJECT_DIR/assets/vehicles/swat_van.png"
          test -s "$PROJECT_DIR/assets/vehicles/agent_car.png"
          test -s "$PROJECT_DIR/assets/vehicles/armed_land_roamer.png"
          test -s "$PROJECT_DIR/assets/vehicles/land_roamer.png"
          test -s "$PROJECT_DIR/assets/ui/gta2/wanted_head_alert.png"

      - name: Apply Quest VR board patch
        shell: bash
        run: |
          set -euo pipefail

          cp "$GITHUB_WORKSPACE/quest_patch/presentation_rig.gd" "$PROJECT_DIR/scripts/presentation_rig.gd"

          MAIN="$PROJECT_DIR/scripts/main.gd"
          INPUT="$PROJECT_DIR/scripts/input_bridge.gd"
          EXPORT="$PROJECT_DIR/export_presets.cfg"

          sed -i '/func _ready() -> void:/,/    _build_boot_ui()/ {
            /    _configure_runtime_profile()/a\    _build_camera()
          }' "$MAIN"

          sed -i '/    _set_boot_progress(0.93, "Preparing camera and multiplayer menu")/ {
            n
            /    _build_camera()/d
          }' "$MAIN"

          sed -i 's/^    add_child(boot_layer)$/    presentation_rig.ui_parent().add_child(boot_layer)/' "$MAIN"
          sed -i 's/^    add_child(canvas)$/    presentation_rig.ui_parent().add_child(canvas)/' "$MAIN"

          sed -i 's/input_bridge.configure(presentation_rig.left_controller, presentation_rig.right_controller, presentation_rig.xr_active)/input_bridge.configure(presentation_rig.left_controller, presentation_rig.right_controller, presentation_rig.xr_active, presentation_rig.ui_input_viewport())/' "$MAIN"

          sed -i '/var ui_navigation_enabled: bool = false/a\var ui_target_viewport: Viewport' "$INPUT"
          sed -i 's/func configure(left: XRController3D, right: XRController3D, enabled: bool) -> void:/func configure(left: XRController3D, right: XRController3D, enabled: bool, ui_target: Viewport = null) -> void:/' "$INPUT"
          sed -i '/    xr_active = enabled and left_controller != null and right_controller != null/a\    ui_target_viewport = ui_target' "$INPUT"
          sed -i '/    Input.parse_input_event(pressed)/a\    if ui_target_viewport != null and ui_target_viewport != get_viewport():\n        ui_target_viewport.push_input(pressed)' "$INPUT"
          sed -i '/    Input.parse_input_event(released)/a\    if ui_target_viewport != null and ui_target_viewport != get_viewport():\n        ui_target_viewport.push_input(released)' "$INPUT"

          # Quest base viewport renders only road/pavement/ground/slope geometry.
          # Buildings exist only in the stereoscopic pop-out layer.
          sed -i '/var path: String = "res:\/\/assets\/gta2\/downtown\/downtown_visual_%d_%d.meshbin" % \[coord.x, coord.y\]/a\    if presentation_rig != null and presentation_rig.xr_active:\n        path = "res://assets/gta2/downtown/downtown_flat_%d_%d.meshbin" % [coord.x, coord.y]' "$MAIN"

          sed -i '/    if force:/a\        if presentation_rig != null and presentation_rig.xr_active and gta2_atlas_material != null:\n            presentation_rig.sync_popout_chunks(gta2_visual_chunks, gta2_atlas_material.albedo_texture)' "$MAIN"

          sed -i '/^func _get_block_rect/i\    if presentation_rig != null and presentation_rig.xr_active and gta2_atlas_material != null:\n        presentation_rig.sync_popout_chunks(gta2_visual_chunks, gta2_atlas_material.albedo_texture)\n' "$MAIN"

          sed -i '/    if input_bridge != null:/i\    if presentation_rig != null:\n        presentation_rig.set_popout_enabled(game_started)\n' "$MAIN"

          sed -i '/@rpc("authority", "call_remote", "reliable")/{N;/func _respawn_player(id: int, spawn: Vector3)/s/call_remote/call_local/;}' "$MAIN"

          sed -i 's@include_filter=""@include_filter="assets/gta2/downtown/*"@' "$EXPORT"

          grep -q 'presentation_rig.ui_parent().add_child(boot_layer)' "$MAIN"
          grep -q 'presentation_rig.ui_parent().add_child(canvas)' "$MAIN"
          grep -q 'ui_target_viewport.push_input(pressed)' "$INPUT"
          grep -q 'include_filter="assets/gta2/downtown/\*"' "$EXPORT"
          grep -q 'downtown_flat_%d_%d.meshbin' "$MAIN"
          grep -q 'presentation_rig.sync_popout_chunks' "$MAIN"
          grep -q '@rpc("authority", "call_local", "reliable")' "$MAIN"
          echo "Quest VR clean-base pop-out patch applied."

      - name: Apply GTA2 law and HUD upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_v0618_upgrade.py" "$PROJECT_DIR"
          grep -q 'const MAX_WANTED_LEVEL: int = 6' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func _law_roles_for_level' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func _apply_gta2_hud_style' "$PROJECT_DIR/scripts/main.gd"
          ! grep -q '_create_vehicle(18, Vector3(320.00' "$PROJECT_DIR/scripts/main.gd"
          grep -q '"swat_van"' "$PROJECT_DIR/scripts/vehicle_data.gd"

      - name: Apply GTA2 shock and electrocute upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_shock_animation_upgrade.py" "$PROJECT_DIR"
          python3 "$PROJECT_DIR/tools/build_gta2_ped_animations.py"
          test -s "$PROJECT_DIR/assets/gta2/peds/animated/skin_00/type_0/shoot.png"
          test -s "$PROJECT_DIR/assets/gta2/peds/animated/skin_00/type_0/electrocute.png"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/shocker.wav"
          grep -q '"electrocute"' "$PROJECT_DIR/scripts/ped_animation.gd"
          grep -q 'func _spawn_shock_arc' "$PROJECT_DIR/scripts/main.gd"
          grep -q '"delivery": "shock_arc"' "$PROJECT_DIR/scripts/weapon_data.gd"

      - name: Apply elevated pawn Quest overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_elevated_pawns.py" "$PROJECT_DIR"
          grep -q 'func sync_elevated_pawns' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'const ELEVATED_PAWN_MIN_Y: float = 0.36' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'func get_sprite() -> SpriteBase3D:' "$PROJECT_DIR/scripts/ped_animation.gd"
          grep -q 'ALPHA_CUT_DISCARD' "$PROJECT_DIR/scripts/ped_animation.gd"
          grep -q 'func get_ped_sprite() -> SpriteBase3D:' "$PROJECT_DIR/scripts/player.gd"
          grep -q 'presentation_rig.sync_elevated_pawns(players)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'const QUEST_DISPLAY_LAYER: int = 1 << 19' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'QUEST_PANEL_POSITION: Vector3 = Vector3(0.0, 1.05, -1.55)' "$PROJECT_DIR/scripts/presentation_rig.gd"
          ! grep -q 'world_scale = 10' "$PROJECT_DIR/scripts/presentation_rig.gd"

      - name: Apply GTA2 Downtown garage stalls
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_gta2_garages.py" "$PROJECT_DIR"
          grep -q 'flotsam_se_gun' "$PROJECT_DIR/scripts/tuning_data.gd"
          grep -q 'fruitbat_paint' "$PROJECT_DIR/scripts/tuning_data.gd"
          grep -q 'func stall_world' "$PROJECT_DIR/scripts/tuning_data.gd"
          grep -q 'const BOMB: String = "bomb"' "$PROJECT_DIR/scripts/tuning_data.gd"
          grep -q 'I ain.t touchin' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'You ain.t got enough cash' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'The vehicle.s been rigged' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'var has_vehicle_bomb: bool = false' "$PROJECT_DIR/scripts/vehicle.gd"
          grep -q 'No cyan pads, no floating MAX PAYNT labels' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'absf(world_position.y - shop_position.y) > 0.85' "$PROJECT_DIR/scripts/tuning_data.gd"
          grep -q 'shop_by_id(String(player_tuning_shop_inside' "$PROJECT_DIR/scripts/main.gd"
          ! grep -q 'central_test_bay' "$PROJECT_DIR/scripts/tuning_data.gd"
          ! grep -q 'DRIVE IN // AUTO OPEN' "$PROJECT_DIR/scripts/main.gd"
          ! grep -q 'Stop inside a Max Paynt bay' "$PROJECT_DIR/scripts/main.gd"

      - name: Apply elevated vehicle Quest overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_elevated_vehicles.py" "$PROJECT_DIR"
          grep -q 'func sync_elevated_vehicles' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'func _make_elevated_vehicle_holder' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'presentation_rig.sync_elevated_vehicles(vehicles)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func get_sprite() -> Sprite3D:' "$PROJECT_DIR/scripts/vehicle.gd"
          grep -q 'func wants_board_sprite() -> bool:' "$PROJECT_DIR/scripts/vehicle.gd"
          grep -q 'func wants_turret_sprite() -> bool:' "$PROJECT_DIR/scripts/vehicle.gd"
          grep -q 'const STARTING_CASH: int = 50000' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'const ELEVATED_PAWN_MIN_Y: float = 0.36' "$PROJECT_DIR/scripts/presentation_rig.gd"
          ! grep -q 'const STARTING_CASH: int = 0' "$PROJECT_DIR/scripts/main.gd"

      - name: Apply Quest heard audio mix
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_gta2_heard_audio.py" "$PROJECT_DIR"
          grep -q 'func set_ear(' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'RADIO // FUNK' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'func note_skid(' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'audio_manager.play_vehicle_impact' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'audio_manager.set_ear(target)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'consume_radio_next()' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'mods.append("BOMB")' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func consume_radio_next()' "$PROJECT_DIR/scripts/input_bridge.gd"
          grep -q 'R-STICK UP radio' "$PROJECT_DIR/scripts/input_bridge.gd"
          grep -q 'func note_footstep(' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'func play_fist_hit(' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'detonation' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'audio_manager.play_molotov_break' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'audio_manager.note_footstep' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func update_nearby_traffic' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'func _free_pawn_clones' "$PROJECT_DIR/scripts/presentation_rig.gd"
          ! grep -q 'car_explosion' "$PROJECT_DIR/scripts/audio_manager.gd"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/detonation.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/fire_loop.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/step_0.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/beds/city.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/radio/radio_funk.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/radio/radio_night.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/radio/radio_spark.wav"
          ! grep -q 'AudioStreamPlayer3D' "$PROJECT_DIR/scripts/audio_manager.gd"

      - name: Apply elevated throw Quest overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_elevated_throws.py" "$PROJECT_DIR"
          grep -q 'func sync_elevated_throws' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'func track_elevated_fx' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'presentation_rig.sync_elevated_throws' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'presentation_rig.track_elevated_fx(projectile, end.y)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func burn_anchors()' "$PROJECT_DIR/scripts/combat_fx.gd"

      - name: Keep elevated roads on the flat board
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_flat_streets.py" "$PROJECT_DIR"
          grep -q '_pop_road' "$PROJECT_DIR/tools/rebuild_gta2_runtime_assets.py"
          grep -q 'func _on_station_floor' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'sync_elevated_pawns(elevated_peds)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func _on_building_roof' "$PROJECT_DIR/scripts/presentation_rig.gd"
          grep -q 'func get_ped_sprite()' "$PROJECT_DIR/scripts/cop.gd"
          grep -q 'func get_ped_sprite()' "$PROJECT_DIR/scripts/civilian.gd"

      - name: Apply GTA2 street FX and Elvis line
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_gta2_street_fx.py" "$PROJECT_DIR"
          grep -q 'func _spawn_elvis_line' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'combat_fx.play_skid_mark' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'combat_fx.play_crash_sparks' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'combat_fx.play_gun_fx' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func set_elvis' "$PROJECT_DIR/scripts/civilian.gd"
          grep -q 'func _play_gta_boom' "$PROJECT_DIR/scripts/combat_fx.gd"
          grep -q 'lerpf(-5.0, 0.5, speed_ratio)' "$PROJECT_DIR/scripts/audio_manager.gd"
          test -s "$PROJECT_DIR/assets/gta2/fx/blood_5.png"
          test -s "$PROJECT_DIR/assets/gta2/fx/skid.png"
          test -s "$PROJECT_DIR/assets/gta2/fx/spark_0.png"
          test -s "$PROJECT_DIR/assets/gta2/fx/boom_0.png"
          test -s "$PROJECT_DIR/assets/gta2/fx/muzzle.png"
          test -s "$PROJECT_DIR/assets/gta2/peds/animated/skin_12/type_0/walk.png"

      - name: Apply GTA2 radio, traffic voices and ped SFX
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/quest_patch/apply_gta2_city_voice.py" "$PROJECT_DIR"
          grep -q 'HEAD RADIO' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'func play_ped_voice' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'func play_elvis_spot' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'TrafficEngine_%d' "$PROJECT_DIR/scripts/audio_manager.gd"
          grep -q 'audio_manager.update_nearby_traffic(vehicles)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func _cue_elvis_line' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'Vector3(306.0, 0.12, 325.6)' "$PROJECT_DIR/scripts/main.gd"
          grep -q 'func _service_ped_voice' "$PROJECT_DIR/scripts/civilian.gd"
          grep -q 'randf_range(0.016, 0.026)' "$PROJECT_DIR/scripts/combat_fx.gd"
          ! grep -R -q 'AudioStreamPlayer3D' "$PROJECT_DIR/scripts"
          test -s "$PROJECT_DIR/assets/audio/gta2/radio/head.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/radio/king.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/ped_idle_0.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/ped_panic_0.wav"
          test -s "$PROJECT_DIR/assets/audio/gta2/sfx/elvis_line.wav"

      - name: Install OpenXR Vendors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/openxr /tmp/openxr.zip
          mkdir -p /tmp/openxr
          wget -q             "https://github.com/GodotVR/godot_openxr_vendors/releases/download/${OPENXR_VENDORS_VERSION}/godotopenxrvendorsaddon.zip"             -O /tmp/openxr.zip
          unzip -q -o /tmp/openxr.zip -d /tmp/openxr
          mkdir -p "$PROJECT_DIR/addons"
          rm -rf "$PROJECT_DIR/addons/godotopenxrvendors"
          cp -a /tmp/openxr/asset/addons/godotopenxrvendors "$PROJECT_DIR/addons/"
          test -f "$PROJECT_DIR/addons/godotopenxrvendors/plugin.gdextension"

      - name: Import and build Quest APK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          godot --headless --editor --path "$PROJECT_DIR" --quit

          mkdir -p "$PROJECT_DIR/build/android-quest"
          godot --headless --verbose --path "$PROJECT_DIR"             --install-android-build-template             --export-debug "Android Quest"             "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"

          test -s "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"
          sha256sum "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk"             > "$PROJECT_DIR/build/android-quest/${EXPORT_NAME}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViceQuest-v0.6.18.25-CityVoice
          path: |
            ${{ env.PROJECT_DIR }}/build/android-quest/*.apk
            ${{ env.PROJECT_DIR }}/build/android-quest/*.sha256
          if-no-files-found: error
          retention-days: 14
